# 푸시·PR마다: 타입 검사 → lint → 단위·품질 회귀 테스트 → 빌드 → 브라우저 E2E
# 실패하면 Playwright 보고서·trace를 Actions 아티팩트로 남긴다 (npx playwright show-trace 로 열기)
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 타입·lint·단위 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # 단위 테스트 + 코스 품질 기준선(고정 지도 데이터, 단계 예산이라 결과가 항상 같다)
      - run: npm test
      # DB 마이그레이션(RLS·RPC·권한) — PGlite, 외부 DB 불필요
      - run: npm run test:db

  e2e:
    name: 브라우저 E2E
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # playwright.config.ts의 webServer가 빌드된 앱을 띄운다. 외부 서버는 MSW 가짜 응답
      - run: npm run test:e2e -- --project=desktop --project=mobile
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
