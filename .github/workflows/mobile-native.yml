name: Mobile native compile

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/**'
      - 'shared/**'
      - '.github/workflows/mobile-native.yml'

permissions:
  contents: read

concurrency:
  group: mobile-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --prefix mobile
      - run: npm --prefix mobile test
      - run: npm --prefix mobile run android
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: chmod +x gradlew
        working-directory: mobile/android
      - run: ./gradlew --no-daemon :app:assembleDebug
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: yorun-recorder-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  ios:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --prefix mobile
      - run: npm --prefix mobile test
      - run: npm --prefix mobile run ios
      # Compile without distribution credentials. This is not a device GPS test or App Store upload.
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
        working-directory: mobile
